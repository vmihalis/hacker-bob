name: Brutalist Review

# Claude + Codex + agy review on trusted maintainer PRs, posted as inline comments.
# CODEX_AUTH is the full ~/.codex/auth.json stored as a GitHub Actions secret.
# Refresh it with `codex login` + `gh secret set CODEX_AUTH` if auth fails.
# The image_generation tool is disabled (codex#21952 gpt-image-2 bug).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: brutalist-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  brutalist:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["vmihalis","ejmockler","RayyanZahid"]'), github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install CLI critics
        working-directory: .github/brutalist-tools
        env:
          EXPECTED_TOOLS_LOCK_SHA256: 32506d6d425025783e47d005561698244373696505d1a3df0ad7f66b1fbd8147
        run: |
          actual="$(sha256sum package-lock.json | cut -d ' ' -f1)"
          if [ "$actual" != "$EXPECTED_TOOLS_LOCK_SHA256" ]; then
            echo "Unexpected brutalist tools lockfile hash: $actual" >&2
            exit 1
          fi
          npm ci --ignore-scripts
          node node_modules/@anthropic-ai/claude-code/install.cjs
          export PATH="$PWD/node_modules/.bin:$PATH"
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          # agy (Antigravity) critic — installed via the upstream script (not npm).
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v brutalist-mcp claude codex agy
          claude --version
          codex --version
          # codex: disable the broken built-in image_generation tool (gpt-image-2)
          mkdir -p "$HOME/.codex"
          printf '[features]\nimage_generation = false\n' > "$HOME/.codex/config.toml"
      - name: Brutalist review
        id: brutalist-review
        # Advisory reviewer only; CI remains the hard merge gate.
        continue-on-error: true
        # Tracks the moving @v1 tag — repointed to each release by the upstream
        # move-tags automation — so this repo auto-updates. Trust root is the
        # owner-controlled ejmockler/brutalist-mcp repo + release pipeline.
        # @v1 ships the turn-cap 20→50 fix (was hitting "max turns (20)" on large PRs).
        uses: ejmockler/brutalist-mcp/packages/github-action@v1
        env:
          BRUTALIST_TIMEOUT: "1800000"
          BRUTALIST_ORCHESTRATOR_TIMEOUT_MS: "2700000"
          # Freeze agy's binary version for the run (stops self-update drift).
          AGY_CLI_DISABLE_AUTO_UPDATE: "1"
        with:
          github-token: ${{ github.token }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          codex-auth: ${{ secrets.CODEX_AUTH }}
          agy-oauth-token: ${{ secrets.AGY_OAUTH_TOKEN }}
          minimum-severity: medium
          # GLM routed critic — Anthropic-compatible gateway (public Tailscale Funnel).
          # Additive 4th critic, hardened by default. GLM is the slowest critic
          # (~5min healthy); down=fast preflight, over-quota 429 retries ~3-4min/chunk.
          # Reviews are advisory, so this never gates merges.
          custom-claude-client-id: glm
          custom-claude-base-url: https://immersivecommons13.tail5da903.ts.net
          custom-claude-auth-token: ${{ secrets.GLM_TOKEN }}
          custom-claude-model: glm-5.2
          custom-claude-small-fast-model: glm-4.5-air
          # glm-5.2 has a 1M context window (was glm-5.1/128k). 128k was the
          # binding floor of the diff-chunk min, splitting diffs into more chunks
          # than necessary (and hammering the GLM gateway concurrently); at 1M,
          # codex (~200k) governs instead. The declared window must match the
          # model's real window so the min still protects GLM from overflow.
          custom-claude-context-window: 1000000
          # Coding-agent PRs are huge: the action's old default (80000) truncated
          # a real 1.39M-char diff to ~78K (94% dropped), so the review silently
          # missed almost everything. Pin a high explicit cap that works on the
          # currently-pinned action (v1.14.7) without waiting on a re-pin.
          # (brutalist-mcp v1.15.1 raises the built-in default to 2000000 too.)
          max-diff-chars: '2000000'
      - name: Report advisory reviewer failure
        if: steps.brutalist-review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "::warning title=Brutalist Review::Advisory review failed; CI remains the hard merge gate."
          body="$(printf 'Brutalist Review failed for %s.\n\nCI remains the hard merge gate.\n\nRun: %s/%s/actions/runs/%s' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          gh pr comment "$PR_URL" --body "$body"
