name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        # Browser integration tests need a hostable headless driver session.
        # This runner ships Chrome but can't start one (sandbox/deps), so opt
        # those tests out here; they run locally and in browser-provisioned CI.
        env:
          BOB_SKIP_BROWSER_TESTS: "1"
        run: npm test
