  ApprovalPendingRecorderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: glassbox-approval-pending-recorder
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt ApprovalPendingRecorderRole.Arn
      Environment:
        Variables:
          APPROVALS_BUCKET: !Ref GlassboxApprovalsBucket
          APPROVAL_TOPIC_ARN: !Ref ApprovalNotificationTopic
      InlineCode: |
        import json
        import os
        import re
        from datetime import datetime, timezone

        HASH_RE = re.compile(r"^[0-9a-f]{64}$")
        EXECUTION_RE = re.compile(r"^[A-Za-z0-9_-]{1,80}$")
        SAFE_TARGET_RE = re.compile(r"^[A-Za-z0-9._:-]{1,255}$")
        ALLOWED_PROFILES = {"smoke", "libheif-cve-2026-49271"}

        def _require_hash(value, field):
            if not isinstance(value, str) or not HASH_RE.fullmatch(value):
                raise RuntimeError(f"{field} must be a lowercase SHA-256 hex digest")
            return value

        def _require_version_id(value):
            if (
                not isinstance(value, str)
                or not value
                or len(value) > 1024
                or any(ord(ch) < 0x20 or ord(ch) == 0x7f for ch in value)
            ):
                raise RuntimeError("grade-freeze VersionId is invalid")
            return value

        def handler(event, context):
            import boto3
            s3 = boto3.client("s3")
            sns = boto3.client("sns")

            execution_name = event.get("executionName")
            if not isinstance(execution_name, str) or not EXECUTION_RE.fullmatch(execution_name):
                raise RuntimeError("executionName cannot safely key a pending approval record")
            profile = event.get("profile")
            if profile not in ALLOWED_PROFILES:
                raise RuntimeError("unsupported or missing engagement profile")
            target = event.get("target")
            if (
                not isinstance(target, str)
                or not SAFE_TARGET_RE.fullmatch(target)
                or target.startswith(".")
                or ".." in target
            ):
                raise RuntimeError("target is invalid")
            grade_result = event.get("gradeResult") if isinstance(event.get("gradeResult"), dict) else {}
            verified = event.get("verifiedFreeze") if isinstance(event.get("verifiedFreeze"), dict) else {}
            grade_hash = _require_hash(grade_result.get("grade_verdict_hash"), "grade verdict hash")
            body_sha256 = _require_hash(
                grade_result.get("grade_freeze_bundle_sha256"),
                "grade-freeze body hash",
            )
            version_id = _require_version_id(grade_result.get("grade_freeze_version_id"))
            expected = {
                "profile": profile,
                "target": target,
                "grade_verdict_hash": grade_hash,
                "grade_freeze_bundle_sha256": body_sha256,
                "grade_freeze_version_id": version_id,
            }
            if any(verified.get(key) != value for key, value in expected.items()):
                raise RuntimeError("automated verifier result does not match the GRADE freeze binding")

            pending_key = f"approvals/pending/{execution_name}.json"
            record = {
                "schema_version": 2,
                "taskToken": event["token"],
                "execution_name": execution_name,
                **expected,
                "requested_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
            }
            s3.put_object(
                Bucket=os.environ["APPROVALS_BUCKET"],
                Key=pending_key,
                Body=json.dumps(record, separators=(",", ":")).encode("utf-8"),
                ContentType="application/json",
            )
            sns.publish(
                TopicArn=os.environ["APPROVAL_TOPIC_ARN"],
                Subject=f"Hacker Bob approval: {profile}",
                Message=json.dumps({
                    "profile": profile,
                    "target": target,
                    "grade_verdict_hash": grade_hash,
                    "grade_freeze_version_id": version_id,
                    "grade_freeze_bundle_sha256": body_sha256,
                    "pending_record_key": pending_key,
                    "instructions": (
                        "Review the exact WORM version, then invoke glassbox-approval-writer "
                        "with decision=approve and this pendingRecordKey; use decision=reject to fail closed."
                    ),
                }, separators=(",", ":")),
            )
            # Returning cannot resolve lambda:invoke.waitForTaskToken.
            return {"pending_record_key": pending_key}

  ApprovalWriterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: glassbox-approval-writer-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: glassbox-approval-writer-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadDeletePendingApprovalRecord
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub ${GlassboxApprovalsBucket.Arn}/approvals/pending/*
              - Sid: WriteHumanApprovalArtifact
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${GlassboxApprovalsBucket.Arn}/approvals/*/*.approved
              - Sid: ReadApprovalHmacKey
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GlassboxApprovalHmacKey
              # Step Functions callback APIs do not support resource-level IAM.
              - Sid: ResolveHumanApprovalTask
                Effect: Allow
                Action:
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                Resource: "*"
              - Sid: ApprovalWriterLogging
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/glassbox-approval-writer*

  ApprovalWriterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: glassbox-approval-writer
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt ApprovalWriterRole.Arn
      Environment:
        Variables:
          APPROVALS_BUCKET: !Ref GlassboxApprovalsBucket
          HMAC_SECRET_ID: !Ref GlassboxApprovalHmacKey
      InlineCode: |
        import hashlib
        import hmac
        import json
        import os
        import re
        from datetime import datetime, timezone

        HASH_RE = re.compile(r"^[0-9a-f]{64}$")
        PENDING_KEY_RE = re.compile(r"^approvals/pending/[A-Za-z0-9_-]{1,80}\.json$")
        SAFE_TARGET_RE = re.compile(r"^[A-Za-z0-9._:-]{1,255}$")
        ALLOWED_PROFILES = {"smoke", "libheif-cve-2026-49271"}
        BINDING_VERSION = "grade-freeze-v2"

        def _require_hash(value, field):
            if not isinstance(value, str) or not HASH_RE.fullmatch(value):
                raise RuntimeError(f"{field} must be a lowercase SHA-256 hex digest")
            return value

        def _require_version_id(value):
            if (
                not isinstance(value, str)
                or not value
                or len(value) > 1024
                or any(ord(ch) < 0x20 or ord(ch) == 0x7f for ch in value)
            ):
                raise RuntimeError("grade-freeze VersionId is invalid")
            return value

        def handler(event, context):
            import boto3
            s3 = boto3.client("s3")
            secretsmanager = boto3.client("secretsmanager")
            sfn = boto3.client("stepfunctions")

            decision = event.get("decision")
            if decision not in {"approve", "reject"}:
                raise RuntimeError("decision must be explicitly approve or reject")
            pending_key = event.get("pendingRecordKey")
            if not isinstance(pending_key, str) or not PENDING_KEY_RE.fullmatch(pending_key):
                raise RuntimeError("pendingRecordKey is invalid")
            bucket = os.environ["APPROVALS_BUCKET"]
            pending_obj = s3.get_object(Bucket=bucket, Key=pending_key)
            pending = json.loads(pending_obj["Body"].read())
            if not isinstance(pending, dict) or pending.get("schema_version") != 2:
                raise RuntimeError("pending approval record schema is invalid")
            task_token = pending.get("taskToken")
            if not isinstance(task_token, str) or not task_token:
                raise RuntimeError("pending approval record has no task token")

            if decision == "reject":
                reason = event.get("reason") or "Named human rejected the grade-freeze release"
                sfn.send_task_failure(
                    taskToken=task_token,
                    error="HumanRejected",
                    cause=str(reason)[:256],
                )
                try:
                    s3.delete_object(Bucket=bucket, Key=pending_key)
                except Exception as error:
                    print(f"pending record cleanup failed after rejection: {error}")
                return {"decision": "rejected", "pending_record_key": pending_key}

            profile = pending.get("profile")
            if profile not in ALLOWED_PROFILES:
                raise RuntimeError("pending approval profile is invalid")
            target = pending.get("target")
            if (
                not isinstance(target, str)
                or not SAFE_TARGET_RE.fullmatch(target)
                or target.startswith(".")
                or ".." in target
            ):
                raise RuntimeError("pending approval target is invalid")
            grade_hash = _require_hash(pending.get("grade_verdict_hash"), "grade verdict hash")
            body_sha256 = _require_hash(
                pending.get("grade_freeze_bundle_sha256"),
                "grade-freeze body hash",
            )
            version_id = _require_version_id(pending.get("grade_freeze_version_id"))

            binding = [profile, target, grade_hash, body_sha256, version_id]
            binding_bytes = json.dumps(
                binding,
                separators=(",", ":"),
                ensure_ascii=False,
            ).encode("utf-8")
            secret = secretsmanager.get_secret_value(
                SecretId=os.environ["HMAC_SECRET_ID"]
            )["SecretString"].encode("utf-8")
            signature = hmac.new(secret, binding_bytes, hashlib.sha256).hexdigest()
            approved_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
            artifact = {
                "schema_version": 2,
                "binding_version": BINDING_VERSION,
                "profile": profile,
                "target_domain": target,
                "grade_verdict_hash": grade_hash,
                "grade_freeze_bundle_sha256": body_sha256,
                "grade_freeze_version_id": version_id,
                "hmac": signature,
                "execution_name": pending.get("execution_name"),
                "approval_request_id": context.aws_request_id,
                "approved_at": approved_at,
            }
            artifact_key = f"approvals/{target}/{grade_hash}.approved"
            s3.put_object(
                Bucket=bucket,
                Key=artifact_key,
                Body=json.dumps(artifact, separators=(",", ":")).encode("utf-8"),
                ContentType="application/json",
            )
            callback_output = {
                "decision": "approved",
                "profile": profile,
                "target": target,
                "grade_verdict_hash": grade_hash,
                "grade_freeze_bundle_sha256": body_sha256,
                "grade_freeze_version_id": version_id,
                "approval_artifact_key": artifact_key,
            }
            # The only success callback path, and it occurs after the durable,
            # v2 content-bound artifact write.
            sfn.send_task_success(
                taskToken=task_token,
                output=json.dumps(callback_output, separators=(",", ":")),
            )
            try:
                s3.delete_object(Bucket=bucket, Key=pending_key)
            except Exception as error:
                print(f"pending record cleanup failed after approval: {error}")
            return callback_output

  # ---------------------------------------------------------------------
  # ARCHITECTURAL FIX (Eric-approved): the downstream Security Hub export
  # step. Wired into the state machine (below) as a Task invoked strictly
  # AFTER verifier approval writes the content-bound .approved artifact.
  # The model's own process/role can never reach this
  # function: it is a separate Lambda under its OWN role
  # (ExportSecurityHubRole), which GlassboxAgentRuntimeExecutionRole neither
  # assumes nor shares, and GlassboxAgentRuntimeExecutionRole no longer holds
  # securityhub:BatchImportFindings at all (see that role's comment above).
  #
  # Reads ONLY the GRADE-time WORM freeze object
  # (mcp/lib/grade-freeze-store.js, written by writeGradeVerdict BEFORE any
  # human approval exists) at
  # s3://<EvidenceBucket>/hacker-bob/grade-freeze/<target_domain>/<grade_verdict_hash>.json
  # -- never live EFS session state, never claims.jsonl, never a re-run
  # bob_finalize_report snapshot -- so this role needs (and is granted)
  # nothing but read access to that one prefix plus BatchImportFindings.
  #
  # Handler: infra/aws/hacker-bob-stack/functions/export-security-hub/index.js.
  # CodeUri is the repo root (not just the function's own directory) so the
  # packaged Lambda can require ../../../../../mcp/lib/asff-builder.js -- the
  # SAME pure ASFF-building module the (now-deregistered)
  # mcp/lib/tools/export-security-hub-finding.js library imports, so this
  # Lambda and that legacy code path can never silently diverge in how an
  # ASFF record is built. This is the standard, if unglamorous, "vendor the
  # whole repo into the zip" SAM pattern -- acceptable here since no build
  # step exists yet to produce a slimmer bundle (see h2-deploy for a future
  # slimming pass); node_modules already carries @aws-sdk/client-s3 and
  # @aws-sdk/client-securityhub as direct package.json dependencies.
  # ---------------------------------------------------------------------
  ExportSecurityHubRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: glassbox-export-security-hub-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: glassbox-export-security-hub-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read-only, scoped to the grade-freeze prefix specifically --
              # never a bare EvidenceBucket/* grant, and never s3:PutObject/
              # DeleteObject anywhere: this role must not be able to write or
              # remove the very evidence it is exporting from.
              - Sid: ReadGradeFreezeEvidence
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${EvidenceBucket.Arn}/hacker-bob/grade-freeze/*
              # The ONLY securityhub:BatchImportFindings grant left in this
              # entire stack -- see GlassboxAgentRuntimeExecutionRole's comment
              # confirming that role no longer holds it.
              - Sid: ExportToSecurityHub
                Effect: Allow
                Action:
                  - securityhub:BatchImportFindings
                Resource: !Sub arn:aws:securityhub:${AWS::Region}:${AWS::AccountId}:product/${AWS::AccountId}/default
              - Sid: ExportSecurityHubLogging
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/glassbox-export-security-hub*

  AsffBuilderLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: glassbox-asff-builder
      Description: Hacker Bob pure ASFF builder and its local dependencies.
      ContentUri: .build/asff-builder-layer
      CompatibleRuntimes:
        - nodejs22.x

  ExportSecurityHubFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: glassbox-export-security-hub
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt ExportSecurityHubRole.Arn
      CodeUri: functions/export-security-hub
      Layers:
        - !Ref AsffBuilderLayer
      Environment:
        Variables:
          ASFF_BUILDER_PATH: /opt/lib/asff-builder.js
          VERIFICATION_CONTRACTS_PATH: /opt/lib/verification-contracts.js
          GRADE_FREEZE_BUCKET: !Ref EvidenceBucket
          SECURITY_HUB_PRODUCT_ARN: !Sub arn:aws:securityhub:${AWS::Region}:${AWS::AccountId}:product/${AWS::AccountId}/default

  GlassboxStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: glassbox-state-machine-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: glassbox-state-machine-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeHackerBobRuntime
                Effect: Allow
                Action:
                  # Live Step Functions integration evaluates InvokeAgentRuntime
                  # against the runtime endpoint ARN, not only the parent Runtime ARN.
                  - bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !GetAtt GlassboxAgentCoreRuntime.AgentRuntimeArn
                  - !Sub
                    - ${RuntimeArn}/runtime-endpoint/DEFAULT
                    - RuntimeArn: !GetAtt GlassboxAgentCoreRuntime.AgentRuntimeArn
              # RunVerifierGate invokes a read-only Lambda that validates the exact
              # GRADE-returned WORM version and body. It cannot approve or resume.
              - Sid: InvokeVerifierGate
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt VerifierGateFunction.Arn
              # WriteVerifierApproval lets a separate verifier-only Lambda write the
              # content-bound .approved artifact. It has no Step Functions callback.
              - Sid: InvokeVerifierApproval
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt VerifierApprovalFunction.Arn
              # NotifyHumanOnLoop publishes safe receipt fields after verifier approval.
              - Sid: PublishHumanOnLoopNotification
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref ApprovalNotificationTopic
              # ARCHITECTURAL FIX (Eric-approved): lets the state machine invoke the
              # downstream export Lambda from the new ExportToSecurityHub Task state
              # (statemachine/hacker-bob-engagement.asl.json), wired directly after
              # verifier approval succeeds.
              - Sid: InvokeExportSecurityHub
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ExportSecurityHubFunction.Arn

  GlassboxEngagementStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: glassbox-engagement
      DefinitionUri: statemachine/hacker-bob-engagement.asl.json
      DefinitionSubstitutions:
        AgentRuntimeArn: !GetAtt GlassboxAgentCoreRuntime.AgentRuntimeArn
        VerifierGateFunctionArn: !GetAtt VerifierGateFunction.Arn
        VerifierApprovalFunctionArn: !GetAtt VerifierApprovalFunction.Arn
        ApprovalNotificationTopicArn: !Ref ApprovalNotificationTopic
        ExportSecurityHubFunctionArn: !GetAtt ExportSecurityHubFunction.Arn
      Role: !GetAtt GlassboxStateMachineRole.Arn
      Type: STANDARD

Outputs:
  DenyEgressSecurityGroupId:
    Description: glassbox-deny-egress-sg id — attach Locker's SG to this for i3.
    Value: !Ref GlassboxDenyEgressSg

  EfsAccessPointArn:
    Description: EFS access point ARN for $HOME persistence (paths.js:44 sessionsRoot()).
    Value: !GetAtt HomeAccessPoint.Arn

  EfsFileSystemId:
    Description: EFS filesystem id.
    Value: !Ref HomeFileSystem

  EvidenceBucketArn:
    Description: S3 Object Lock (COMPLIANCE) evidence bucket ARN.
    Value: !GetAtt EvidenceBucket.Arn

  VerifierAttestationBucketArn:
    Description: >
      The mutable GRADE->REPORT approval-control store. The runtime can read only
      approvals/*/*.approved; pending records and final writes remain unreachable.
    Value: !GetAtt GlassboxApprovalsBucket.Arn

  # Backward-compatible live-stack output retained for operators and scripts
  # already bound to glassbox-agentcore-demo.
  ApprovalsBucketArn:
    Description: Mutable GRADE->REPORT approval-control store ARN.
    Value: !GetAtt GlassboxApprovalsBucket.Arn

  HumanApprovalsBucketName:
    Description: >
      Bucket name used to list approvals/pending/ keys without opening the
      token-bearing pending JSON on a projector.
    Value: !Ref GlassboxApprovalsBucket

  VerifierAttestationHmacSecretArn:
    Description: >
      HMAC-SHA256 key for schema-v2 approval artifacts. Read by the runtime
      for defense-in-depth verification and verifier/human approval writers for signing.
    Value: !Ref GlassboxApprovalHmacKey

  # Backward-compatible live-stack output retained for in-place updates.
  ApprovalHmacSecretArn:
    Description: HMAC-SHA256 key ARN for approval artifacts.
    Value: !Ref GlassboxApprovalHmacKey

  SecurityHubProductArn:
    Description: Security Hub custom product ARN for BatchImportFindings.
    Value: !Sub arn:aws:securityhub:${AWS::Region}:${AWS::AccountId}:product/${AWS::AccountId}/default

  VerifierApprovalFunctionArn:
    Description: >
      Human-on-the-loop verifier writer. Invoked by Step Functions after
      RunVerifierGate passes; writes the content-bound .approved artifact
      consumed by REPORT and has no Step Functions callback permission.
    Value: !GetAtt VerifierApprovalFunction.Arn

  ExportSecurityHubFunctionArn:
    Description: >
      ARCHITECTURAL FIX (Eric-approved): the downstream Security Hub export Lambda,
      invoked by the state machine strictly AFTER verifier approval, under
      its own ExportSecurityHubRole (securityhub:BatchImportFindings +
      s3:GetObject scoped to EvidenceBucket's hacker-bob/grade-freeze/ prefix only).
      GlassboxAgentRuntimeExecutionRole (the model's role) holds neither this
      function's ARN nor securityhub:BatchImportFindings.
    Value: !GetAtt ExportSecurityHubFunction.Arn

  ApprovalWriterFunctionArn:
    Description: >
      Invoke this function only as a named human, out of band, with an exact
      approvals/pending/<execution>.json key and explicit approve/reject decision.
      Neither the state-machine role nor the runtime role can invoke it.
    Value: !GetAtt ApprovalWriterFunction.Arn

  ApprovalNotificationTopicArn:
    Description: SNS topic carrying token-free human-on-the-loop verifier-advance notices.
    Value: !Ref ApprovalNotificationTopic

  StateMachineArn:
    Description: hacker-bob-engagement Step Functions state machine ARN.
    Value: !Ref GlassboxEngagementStateMachine

  ExecutionRoleArn:
    Description: AgentCore Runtime execution role ARN (h2-deploy attaches this).
    Value: !GetAtt GlassboxAgentRuntimeExecutionRole.Arn

  AgentRuntimeArn:
    Description: AgentCore Runtime ARN (h2-deploy invokes this).
    Value: !GetAtt GlassboxAgentCoreRuntime.AgentRuntimeArn
